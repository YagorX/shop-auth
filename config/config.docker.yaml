service_name: auth-service
env: docker
version: dev

log_level: info
shutdown_timeout: 10s

token_ttl: 1h
refresh_ttl: 168h

grpc:
  port: 44044
  timeout: 5s

http:
  port: 8082
  timeout: 5s

otlp:
  endpoint: jaeger:4317

postgres:
  host: postgres-haproxy
  port: 5432
  db_name: authdb
  user: auth_user
  password: auth_password
  ssl_mode: disable
  statement_timeout: 5s
  # Пул на ОДИН инстанс. Правило: max_open_conns × число_инстансов < max_connections (100) − запас на миграции/админа.
  # При >4 инстансах арифметика не сходится — нужен PgBouncer.
  max_open_conns: 25
  max_idle_conns: 25        # == max_open_conns: пул не «сдувается» между всплесками
  conn_max_lifetime: 5m     # обязательно > 0: после failover Patroni соединения не должны жить на старом primary
  conn_max_idle_time: 1m
  connect_timeout: 5s
  connect_retries: 6

tls:
  enabled: true
  cert_file: /app/certs/auth-service.crt
  key_file: /app/certs/auth-service.key
  ca_file: /app/certs/ca.crt
  client_ca_file: /app/certs/ca.crt
  require_client_cert: true

